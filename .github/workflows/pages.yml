# Publica a pasta site/ (gerada por `npm run build`) no GitHub Pages a cada push na main.
# O build roda localmente porque precisa da senha e de private/, que nunca vão para o git.
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir que não há dados em texto claro
        run: |
          test ! -e private
          ! grep -rl "window.TRIP = \|window.TRIP_PLACES = \|Vinicius\|Luiza" site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
